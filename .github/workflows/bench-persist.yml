name: Persist Bench Results

on:
  push:
    branches: [main]

jobs:
  persist:
    name: Save bench results to bench-results branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install DevAgent
        run: pip install -e ".[dev]"

      - name: Run canary and save JSON
        run: devagent bench canary --save-json

      - name: Dry-run all tasks and save JSON
        # Unmodified fixtures will fail the oracle — that is expected in dry mode.
        # Exit code 1 is suppressed; the JSON is what we want to persist.
        run: devagent bench native --dry || true

      - name: Commit results to bench-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Collect all timestamped result files written this run (exclude partials)
          RESULTS=$(ls benchmarks/results/canary_*.json benchmarks/results/native_*.json 2>/dev/null || true)
          if [ -z "$RESULTS" ]; then
            echo "No result files found — skipping persist step"
            exit 0
          fi

          # Switch to bench-results branch, creating it as an orphan if it does not exist.
          # Fetch first so we have the latest remote state before we commit.
          if git fetch origin bench-results:bench-results 2>/dev/null; then
            git checkout bench-results
          else
            git checkout --orphan bench-results
          fi

          # Copy each result file into the branch root
          for RESULT in $RESULTS; do
            FILENAME=$(basename "$RESULT")
            cp "$RESULT" "$FILENAME"
            git add "$FILENAME"
          done

          git commit -m "ci: bench results $(date -u +%Y%m%d_%H%M%S) [skip ci]" \
            || echo "Nothing to commit"

          # Rebase against any concurrent pushes that landed since our fetch, then push.
          git pull --rebase origin bench-results 2>/dev/null || true
          git push origin bench-results

      - name: Update LEADERBOARD.md on main
        run: |
          git checkout main
          git pull --rebase origin main
          devagent bench leaderboard --remote --output LEADERBOARD.md
          git add LEADERBOARD.md
          git diff --cached --quiet \
            || git commit -m "chore: update leaderboard [skip ci]"
          git push origin main
