[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devagent"
version = "1.3.0"
description = "AI coding agent harness — chat-session based, GitHub-native, offline-first"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "DevAgent Authors", email = "hello@devagent.dev" }
]
keywords = ["cli", "agent", "mcp", "llm", "github", "ollama", "coding-agent", "codeprism"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "platformdirs>=4.2.0",
    "tomli-w>=1.0.0",
    "mcp[cli]>=1.0.0",
    "codeprism-ai>=0.1.1",
    # LLM provider SDKs — official packages, no framework wrapper
    "ollama>=0.3.0",
    "anthropic>=0.34.0",
    "openai>=1.40.0",
    "google-generativeai>=0.8.0",
    # HTTP + async
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "tenacity>=9.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    # REST + WebSocket API server (devagent serve)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # JSON Schema validation (--json-schema flag)
    "jsonschema>=4.0.0",
    # REPL tab completion
    "prompt_toolkit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/DevAgent"
Repository = "https://github.com/yourusername/DevAgent.git"
Issues = "https://github.com/yourusername/DevAgent/issues"

[project.scripts]
devagent = "devagent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
notebooks = [
    "nbformat>=5.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Rules we intentionally skip for this codebase:
#   BLE001 – broad Exception catches are deliberate in CLI/agent error handlers
#   S110   – try-except-pass is used for optional feature detection (CodePrism, router)
#   PLW1510 – subprocess.run without check= is fine in shell-tool contexts
#   F821   – ruff flags names in unreachable dead-code blocks as undefined
ignore = ["BLE001", "S110", "PLW1510", "F821"]

[tool.hatch.build.targets.wheel]
packages = ["devagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
